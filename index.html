<!DOCTYPE html>
<html lang="zh-CN" data-theme="t1">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AudioEdition · 基于 ffmpeg/flac 的音频工具箱</title>
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="app.css">
</head>
<body>

<!-- ============================ Header ============================ -->
<header class="header">
  <div class="brand">
    <div class="brand__mark" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round">
        <path d="M4 14v-4 M8 16V8 M12 20V4 M16 16V8 M20 14v-4"/>
      </svg>
    </div>
    <div class="brand__text">
      <h1 class="brand__title">AudioEdition</h1>
      <p class="brand__sub">基于 ffmpeg/flac 的音频工具箱</p>
    </div>
  </div>

  <!-- 执行链：常驻顶栏，选中文件后在此查看/编辑将要执行的动作序列 -->
  <div class="chainbar">
    <span class="chainbar__label">执行链</span>
    <div class="chain" id="chain"><!-- app.js --></div>
    <div class="chainbar__acts">
      <button class="btn btn--xs btn--run" id="chainRun"
              title="按顺序执行整条链，作用于已勾选的文件">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M8 5.5v13l11-6.5z"/>
        </svg>
        执行链
      </button>
      <button class="btn btn--xs" id="chainSave">保存预设</button>
      <button class="btn btn--xs btn--ghost" id="chainExport">导出脚本</button>
    </div>

    <!-- 试听音量：控制顶部共用的 <audio id="player"> -->
    <div class="chainbar__vol">
      <button class="vol__btn" id="volMute" aria-pressed="false"
              aria-label="静音" title="静音 / 取消静音">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M4 9.5h3.2L11 6v12l-3.8-3.5H4z"/>
          <path d="M15 9.5a4 4 0 0 1 0 5"/>
          <path d="M17.6 7a7.5 7.5 0 0 1 0 10"/>
        </svg>
      </button>
      <input class="vol__range" id="volRange" type="range" min="0" max="100" step="1"
             value="100" aria-label="试听音量" title="试听音量">
      <span class="vol__val" id="volVal" aria-hidden="true">100</span>
    </div>
  </div>

  <div class="header__spacer"></div>

  <!-- 主题切换：3 套类型 x 浅/深，用于视觉验收 -->
  <div class="switchgroup" role="group" aria-label="配色类型">
    <button class="seg" data-set-theme="t1" aria-pressed="true"><span class="dot dot--t1"></span>蓝橙</button>
    <button class="seg" data-set-theme="t2" aria-pressed="false"><span class="dot dot--t2"></span>绿橙</button>
    <button class="seg" data-set-theme="t3" aria-pressed="false"><span class="dot dot--t3"></span>紫珊瑚</button>
  </div>
  <button class="btn btn--icon" id="modeToggle" title="切换深浅色" aria-label="切换深浅色">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round">
      <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>
    </svg>
  </button>
</header>

<!-- ============================= Body ============================= -->
<div class="body">

  <!-- ---------------------- 左侧：任务队列 + 日志 ---------------------- -->
  <aside class="sidebar" aria-label="任务队列与日志">

    <section class="pane pane--queue">
      <div class="pane__head">
        <h2 class="pane__title">任务队列</h2>
        <span class="badge badge--run" id="queueAgg">队列为空</span>
      </div>
      <div class="pane__body" id="queueList"><!-- app.js --></div>
    </section>

    <div class="splitter" id="sidebarSplitter" role="separator" aria-orientation="horizontal"
         tabindex="0" aria-label="调整任务队列与日志的高度"><span></span></div>

    <section class="pane pane--log">
      <div class="pane__head">
        <h2 class="pane__title">日志输出</h2>
        <button class="btn btn--ghost btn--xs" id="clearLog">清空</button>
      </div>
      <div class="pane__body pane__body--log" id="logList"><!-- app.js --></div>
    </section>

  </aside>

  <!-- ---------------------------- 主工作区 ---------------------------- -->
  <main class="workspace" aria-label="文件列表">

    <!-- 常驻选择条：全选/反选必须随时可达，不能藏在 bulkbar 里
         （bulkbar 只在"已选中"时才出现，否则全选控件永远点不到） -->
    <div class="selbar">
      <label class="check" title="全选 / 取消全选">
        <input type="checkbox" id="selectAll"><span></span>
      </label>
      <span class="selbar__label">全选</span>
      <button class="btn btn--xs btn--ghost" id="invertSel">反选</button>
      <span class="selbar__spacer"></span>
      <span class="selbar__count" id="selCount">共 0 个文件</span>
    </div>

    <!-- 批量模式操作栏（选中 >=1 时出现） -->
    <div class="bulkbar" id="bulkbar" hidden>
      <strong id="bulkCount">已选 0 个文件</strong>
      <div class="bulkbar__acts">
        <button class="btn btn--sm" data-bulk="convert">批量转换</button>
        <button class="btn btn--sm" data-bulk="tag">批量改标签</button>
        <button class="btn btn--sm" data-bulk="cover">批量嵌封面</button>
        <button class="btn btn--sm" data-bulk="normalize">响度标准化</button>
        <button class="btn btn--sm" data-bulk="rename">按标签重命名</button>
        <button class="btn btn--sm" data-bulk="zip">打包 ZIP</button>
        <button class="btn btn--sm btn--danger" data-bulk="delete">删除</button>
        <button class="btn btn--sm btn--ghost" id="bulkClear">取消选择</button>
      </div>
    </div>

    <div class="filelist" id="fileList"><!-- app.js --></div>

  </main>
</div>

<!-- ======================== 功能卡片窗口（停靠层） ========================
     停靠在浏览器窗口【下边缘】：收起时只有快照条恰好露在边缘上方，
     面板整体位于窗口边缘之下（不可见）。展开时盒高增大，快照条随之上移，
     面板从边缘下方升入视野。

     注意：这个停靠层必须在 .body 之内，且 .body 的 overflow 保持 visible
     —— 若在 body 之外，body 是 flex 列容器，未定位的绝对定位元素会以
     body 的静态位置为参照，而不是视口，面板会推不动。 -->
<div class="dock" id="dock">

  <div class="drawer" id="drawer" data-open="false" style="--drawer-h:0px">

    <!-- 顶端：把手 + 5 个卡片快照（收起时唯一可见部分） -->
    <div class="drawer__bar">
      <button class="drawer__handle" id="drawerHandle" aria-expanded="false"
              aria-controls="drawerPanel" title="点击展开/收起，可上下拖拽">
        <span class="drawer__grip" aria-hidden="true"></span>
      </button>
      <div class="snaps" id="cardSnaps"><!-- app.js --></div>
    </div>

    <!-- 下方：展开后升入视野的整个栏目 -->
    <div class="drawer__panel" id="drawerPanel">

      <div class="drawer__viewport" id="cardViewport">
        <div class="drawer__head">
          <h2 class="drawer__title">功能卡片</h2>
          <span class="drawer__scope" id="drawerScope">未选中文件</span>
          <button class="btn btn--ghost btn--xs" id="drawerClose">收起</button>
        </div>

        <div class="drawer__cards" id="cardSections"><!-- app.js --></div>
      </div>

      <!-- 搜索固定在窗口最底部：点击唤出，带缓出动画 -->
      <div class="drawer__search" id="searchDock">
        <button class="searchbtn" id="searchToggle" aria-expanded="false"
                aria-controls="searchField">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round" aria-hidden="true">
            <circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/>
          </svg>
          <span>搜索卡片</span>
        </button>
        <div class="searchfield" id="searchField">
          <input class="input input--search" id="cardSearch" type="search"
                 placeholder="输入卡片名称或说明…" aria-label="搜索卡片">
          <button class="btn btn--ghost btn--xs" id="searchClear">清除</button>
        </div>
      </div>

    </div>
  </div>
  <div class="drawer-backdrop"></div>
</div>

<!-- ============================ 浮动通知 ============================ -->
<div class="notice" id="notice" hidden role="status">
  <div class="notice__icon" aria-hidden="true">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
      <path d="M12 8v5M12 16.5h.01"/><circle cx="12" cy="12" r="9"/>
    </svg>
  </div>
  <div class="notice__text">
    <strong id="noticeTitle">提示</strong>
    <span id="noticeMsg"></span>
  </div>
  <button class="btn btn--ghost btn--xs" id="noticeClose" aria-label="关闭">关闭</button>
</div>

<!-- 元数据编辑模态：对应原型 MetadataEditForm (2:105) -->
<div class="modal" id="metaModal" hidden>
  <div class="modal__scrim" data-close></div>
  <div class="modal__box" role="dialog" aria-modal="true" aria-labelledby="metaModalTitle">
    <h2 class="modal__title" id="metaModalTitle">编辑元数据</h2>
    <p class="modal__sub" id="metaModalSub">—</p>
    <div class="modal__form" id="metaForm"><!-- app.js --></div>
    <div class="modal__acts">
      <button class="btn btn--ghost" data-close>取消</button>
      <button class="btn btn--primary" id="metaSave">保存</button>
    </div>
  </div>
</div>

<!-- ============================ 卡片编辑器 ============================ -->
<div class="modal" id="cardModal" hidden>
  <div class="modal__scrim" data-close></div>
  <div class="modal__box modal__box--wide" role="dialog" aria-modal="true"
       aria-labelledby="cardModalTitle">
    <h2 class="modal__title" id="cardModalTitle">编辑卡片</h2>
    <p class="modal__sub" id="cardModalSub">—</p>

    <div class="cardedit">
      <!-- 左：基本信息 + 参数表单 -->
      <div class="cardedit__col">
        <div class="cardedit__base">
          <label class="field">
            <span>卡片名称</span>
            <input class="input" id="cardName" maxlength="40" placeholder="例如：转 48k 立体声 FLAC">
          </label>
          <label class="field">
            <span>分类</span>
            <select class="input" id="cardCat"></select>
          </label>
          <label class="field field--wide">
            <span>一句话说明</span>
            <input class="input" id="cardDesc" maxlength="120" placeholder="显示在卡片上的描述">
          </label>
          <label class="field field--wide">
            <span>基础操作</span>
            <select class="input" id="cardOp"></select>
          </label>
        </div>

        <div class="cardedit__opsdesc" id="cardOpDesc"></div>

        <h4 class="cardedit__h">参数
          <span class="cardedit__hint">每项都标了取值范围与作用</span>
        </h4>
        <div class="cardedit__params" id="cardParams"><!-- app.js --></div>
      </div>

      <!-- 右：图标 + 说明 + 命令预览 -->
      <div class="cardedit__col cardedit__col--side">
        <h4 class="cardedit__h">图标</h4>
        <div class="iconpick" id="cardIcons" role="radiogroup" aria-label="卡片图标"></div>

        <h4 class="cardedit__h">等价命令预览</h4>
        <pre class="cmdpreview" id="cardPreview">—</pre>
        <p class="cardedit__note" id="cardNote">
          预览只是把参数代进模板，方便你确认改了什么；实际执行仍走参数白名单，
          不会拼接 shell 字符串。
        </p>
        <div class="cardedit__err" id="cardErr" hidden></div>
      </div>
    </div>

    <div class="modal__acts">
      <button class="btn btn--ghost btn--danger" id="cardDelete" hidden>删除卡片</button>
      <span class="cardedit__spacer"></span>
      <button class="btn btn--ghost" data-close>取消</button>
      <button class="btn btn--ghost" id="cardSaveAs">另存为新卡片</button>
      <button class="btn btn--primary" id="cardSave">保存</button>
    </div>
  </div>
</div>

<!-- ============================ 拖拽导入遮罩 ============================ -->
<div class="dropzone" id="dropzone" hidden>
  <div class="dropzone__box">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"
         stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M12 16V4M7 9l5-5 5 5"/><path d="M4 16v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/>
    </svg>
    <strong id="dropTitle">松开以导入</strong>
    <span id="dropHint">支持音频文件与整个文件夹</span>
  </div>
</div>

<!-- ============================ 上传进度 ============================ -->
<div class="uploadbar" id="uploadbar" hidden>
  <div class="uploadbar__row">
    <strong id="uploadLabel">正在导入…</strong>
    <span id="uploadPct">0%</span>
  </div>
  <div class="progress"><i id="uploadFill" style="width:0%"></i></div>
  <div class="uploadbar__acts">
    <button class="btn btn--xs btn--ghost" id="uploadCancel">取消</button>
  </div>
</div>

<!-- ============================ 右键菜单 ============================ -->
<div class="ctxmenu" id="ctxmenu" hidden role="menu" aria-label="文件操作"></div>

<!-- 试听播放器：全页共用一个 audio，天然保证同一时刻只有一个文件在放 -->
<audio id="player" preload="metadata"></audio>

<script src="app.js"></script>
<script src="api.js"></script>
</body>
</html>
